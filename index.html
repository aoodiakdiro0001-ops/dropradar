function desc(r){return (r.d[lang]||r.d.en);}
function buildFilters(){
const tys=[...new Set(DROPS.map(r=>r.ty))],nets=[...new Set(DROPS.map(r=>r.net))],costs=[...new Set(DROPS.map(r=>r.cost))];
document.getElementById('fType').innerHTML='<option value="">'+t('allT')+'</option>'+tys.map(x=>`<option value="${x}">${t('ty_'+x)||x}</option>`).join('');
document.getElementById('fNet').innerHTML='<option value="">'+t('allN')+'</option>'+nets.map(x=>`<option>${x}</option>`).join('');
document.getElementById('fCost').innerHTML='<option value="">'+t('allC')+'</option>'+costs.map(x=>`<option value="${x}">${t('cost_'+x)||x}</option>`).join('');
const st=document.getElementById('smType');if(st&&!st.options.length)st.innerHTML=tys.map(x=>`<option value="${x}">${t('ty_'+x)||x}</option>`).join('');
}
function renderBoard(){
const ft=document.getElementById('fType').value,fn=document.getElementById('fNet').value,fc=document.getElementById('fCost').value;
const q=document.getElementById('fQ').value.trim().toLowerCase();
const comm=sGet('dr_comm',[]);
const all=DROPS.concat(comm.map((c,i)=>({id:'c'+i,n:c.n,ty:c.ty,net:'?',cost:'Free',u:c.u,comm:1,d:{en:c.note||'',tr:c.note||'',ar:c.note||''}})));
const list=all.filter(r=>(!ft||r.ty===ft)&&(!fn||r.net===fn)&&(!fc||r.cost===fc)&&(!q||(r.n+' '+desc(r)).toLowerCase().includes(q)));
list.sort((a,b)=>(b.feat||0)-(a.feat||0));
document.getElementById('board').innerHTML=list.map(r=>`<div class="card${r.feat?' feat':''}"><h3>${esc(r.n)} ${r.feat?`<span class="tag gold">${t('featB')}</span>`:''}${isRef(r)?`<span class="tag grn">${t('refB')}</span>`:''}${r.comm?'<span class="tag">COMMUNITY</span>':''}</h3><div class="meta">${t('ty_'+r.ty)||r.ty} · ${esc(r.net)} · ${t('cost_'+r.cost)||r.cost}</div><p>${esc(desc(r)).slice(0,140)}</p><div class="row"><a href="${refFor(r)}" target="_blank" rel="nofollow sponsored noopener" class="go" style="text-decoration:none;font-size:13px;padding:9px 18px">${t('openB')}</a></div></div>`).join('');
}
function submitDrop(){
const n=document.getElementById('smName').value.trim(),u=document.getElementById('smUrl').value.trim();
if(n.length<2||!/^https:\/\//i.test(u)){toast(t('smNeed'));return;}
const c=sGet('dr_comm',[]);c.unshift({n,u,ty:document.getElementById('smType').value,note:document.getElementById('smNote').value.trim(),time:new Date().toLocaleString()});
sSet('dr_comm',c.slice(0,100));renderBoard();renderComm();toast(t('smOk'));
document.getElementById('smName').value='';document.getElementById('smUrl').value='';document.getElementById('smNote').value='';
}
function renderComm(){const c=sGet('dr_comm',[]);document.getElementById('smList').innerHTML=c.length?`<h2 style="margin-top:14px;font-size:15px">${t('smListT')}</h2>`+c.slice(0,20).map(x=>`<div class="note"><b>${esc(x.n)}</b> — <a target="_blank" rel="noopener" style="color:var(--blu)" href="${esc(x.u)}">${esc(x.u).slice(0,60)}</a><br><small>${esc(x.note||'')}</small></div>`).join(''):'';}
function fmtN(n){if(n>=1e9)return (n/1e9).toFixed(2)+'B';if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return String(Math.round(n));}
async function loadMarkets(silent){
try{
const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1&sparkline=false&price_change_percentage=24h');
if(!r.ok)throw 0;const j=await r.json();
document.getElementById('mkBody').innerHTML=j.map((c,i)=>{const ch=c.price_change_percentage_24h||0;
return `<tr><td>${i+1}</td><td><b>${esc(c.symbol||'').toUpperCase()}</b> <small style="color:var(--mut)">${esc(c.name||'')}</small></td><td>$${Number(c.current_price||0).toLocaleString('en-US')}</td><td class="${ch>=0?'up':'dn'}" dir="ltr">${ch>=0?'+':''}${ch.toFixed(2)}%</td><td>$${fmtN(c.market_cap||0)}</td></tr>`;}).join('');
const tr=await fetch('https://api.coingecko.com/api/v3/search/trending');const tj=await tr.json();
document.getElementById('trendRow').innerHTML=(tj.coins||[]).slice(0,7).map(x=>`<span class="tag">🔥 ${esc((x.item||{}).name||'?')} (${esc((x.item||{}).symbol||'?')})</span>`).join('');
document.getElementById('mSync').textContent='✓ '+t('synced')+' '+new Date().toLocaleTimeString();
}catch(e){if(!silent)toast(t('nodata'));}
}
function renderDonate(){
const P=CONFIG.pay;
document.getElementById('btcA').textContent=P.btc;
document.getElementById('usdtA').textContent=P.usdt;
document.getElementById('donQR').src='https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent('bitcoin:'+P.btc);
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.coinzillaSrc){el.innerHTML='';const s=document.createElement('script');s.async=true;s.src=A.coinzillaSrc;s.dataset.zone=A.coinzillaZone||'';el.appendChild(s);}
else if(A.cointrafficSrc){el.innerHTML='';const s=document.createElement('script');s.async=true;s.src=A.cointrafficSrc;el.appendChild(s);}
else if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
}
setLang('en');loadAds();renderDonate();renderComm();loadMarkets();setInterval(()=>loadMarkets(true),300000);
</script>
</body>
</html>
